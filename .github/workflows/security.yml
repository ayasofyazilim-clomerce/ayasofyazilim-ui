name: Security

# gitleaks with its default rules, then with the private customer-name rules from the Actions secret
# GITLEAKS_PRIVATE_RULES (a gitleaks TOML config). The names never enter this repository, and --redact keeps the
# matches out of the log. Pull requests scan their own commits; main, the weekly run and manual runs scan everything.
# Known-safe findings are ignored by fingerprint in .gitleaksignore.

# Runners: GitHub-hosted on purpose. The repository is public, so a fork's pull request must never reach the
# org's self-hosted runners; do not switch these jobs to vars.RUNNER_LABELS.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified binary)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan (default rules, then the private rules when the secret is set)
        shell: bash
        env:
          PR_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PRIVATE_RULES: ${{ secrets.GITLEAKS_PRIVATE_RULES }}
        run: |
          range=()
          if [ -n "$PR_RANGE" ]; then range=(--log-opts="--diff-filter=tuxdb $PR_RANGE"); fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 "${range[@]}"
          if [ -z "$PRIVATE_RULES" ]; then
            echo "GITLEAKS_PRIVATE_RULES is not set: private rules skipped"
            exit 0
          fi
          printf '%s\n' "$PRIVATE_RULES" > "$RUNNER_TEMP/private-rules.toml"
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/private-rules.toml" --redact --no-banner --exit-code 1 "${range[@]}"
