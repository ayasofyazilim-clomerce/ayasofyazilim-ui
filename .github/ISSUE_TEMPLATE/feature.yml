name: Feature
description: Ask for a new capability or a change in behaviour.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what can they not do today? Describe the need, not a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: The outcome
      description: What would be different when it is done? One sentence a person could check.
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Ideas and alternatives
      description: Optional. Options you considered, and existing tools or libraries that might already do it.
  - type: dropdown
    id: priority
    attributes:
      label: How urgent is it for you?
      options:
        - "p3: nice to have"
        - "p2: needed this quarter"
        - "p1: blocks my work"
    validations:
      required: true
  - type: markdown
    attributes:
      value: Leave out secrets, hosts, customer names and personal data.
