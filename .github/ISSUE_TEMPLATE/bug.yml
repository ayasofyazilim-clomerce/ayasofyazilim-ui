name: Bug
description: Something does not work as it should.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Remove secrets, hosts and customer details first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit, environment
